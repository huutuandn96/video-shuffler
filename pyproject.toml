[project]
name = "video-shuffler"
version = "0.5.0"
description = "Cắt video thành các đoạn 1-2s, xáo trộn và ghép thành nhiều clip ngắn"
requires-python = ">=3.10"
dependencies = [
    "pywebview>=6",
    "pillow>=11",
    "numpy>=2",
]

[project.scripts]
vshuffle = "vshuffle.cli:main"
vshuffle-ui = "vshuffle.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vshuffle"]
